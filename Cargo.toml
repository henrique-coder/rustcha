[package]
name = "rustcha"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Henrique Moreira <78804989+henrique-coder@users.noreply.github.com>"]
description = "CAPTCHA text recognition for Python using Rust and ONNX Runtime."
license = "MIT"
publish = false
homepage = "https://github.com/henrique-coder/rustcha"
repository = "https://github.com/henrique-coder/rustcha.git"
readme = "README.md"
keywords = ["captcha", "ocr", "onnx", "python", "rust"]
categories = ["api-bindings", "computer-vision"]

[lib]
name = "_rustcha"
crate-type = ["cdylib"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }

ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "copy-dylibs",
    "download-binaries",
    "std",
    "tls-rustls",
] }

pyo3 = { version = "0.29.2", default-features = false, features = ["abi3-py311", "extension-module", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
