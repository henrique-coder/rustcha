name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of deterministic images in the corpus"
        required: false
        default: "500"
        type: string
      iterations:
        description: "Measured repetitions per case"
        required: false
        default: "3"
        type: string
      warmup:
        description: "Warmup images per case"
        required: false
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          - python-version: "3.15"
            os: ubuntu-latest
          - python-version: "3.15"
            os: windows-latest
          - python-version: "3.15"
            os: macos-15
        include:
          - os: ubuntu-latest
            python-version: "3.15"
            backend: rustcha
          - os: windows-latest
            python-version: "3.15"
            backend: rustcha
          - os: macos-15
            python-version: "3.15"
            backend: rustcha
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.2"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Install project dependencies
        if: matrix.backend != 'rustcha'
        run: uv sync --frozen --group benchmark
      - name: Install project dependencies without unavailable reference wheel
        if: matrix.backend == 'rustcha'
        run: >-
          uv sync --frozen --group benchmark
          --no-install-package ddddocr
          --no-install-package onnxruntime
          --no-install-package opencv-python-headless
          --no-install-package numpy
      - name: Build optimized extension
        run: uv run maturin develop --release
      - name: Run comparison
        env:
          BENCHMARK_COUNT: ${{ inputs.count }}
          BENCHMARK_ITERATIONS: ${{ inputs.iterations }}
          BENCHMARK_WARMUP: ${{ inputs.warmup }}
          BENCHMARK_BACKEND: ${{ matrix.backend || 'both' }}
        shell: bash
        run: >-
          uv run python benchmarks/benchmark.py
          --backend "$BENCHMARK_BACKEND"
          --count "$BENCHMARK_COUNT"
          --iterations "$BENCHMARK_ITERATIONS"
          --warmup "$BENCHMARK_WARMUP"
          --json benchmark-results.json
          --report benchmark-report.md
      - name: Add results to job summary
        shell: bash
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("benchmark-results.json", encoding="utf-8") as file:
              result = json.load(file)

          print("## Benchmark results")
          print()
          print(f"- Corpus: `{result['corpus_count']}` images")
          print(f"- Corpus SHA-256: `{result['corpus_sha256']}`")
          if result["agreement"] is not None:
              print(f"- Output agreement: `{result['agreement']:.1%}`")
          print()
          print("| Backend | Volume | Operation | Median (s) | Images/s |")
          print("| --- | ---: | --- | ---: | ---: |")
          for item in result["measurements"]:
              print(
                  f"| {item['backend']} | {item['volume']} | {item['operation']} "
                  f"| {item['median_seconds']:.4f} | {item['images_per_second']:.2f} |"
              )
          PY
      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results-${{ github.run_id }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            benchmark-results.json
            benchmark-report.md
          retention-days: 30
